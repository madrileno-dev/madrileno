# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Check formatting, scalafix, compile, test
      run: sbt "scalafmtSbtCheck; scalafmtCheckAll; scalafixAll --check; compile; testFull; Test/verifyErrorCodes; shutdown"
      # Optional: uploads the dependency graph for Dependabot alerts. It's a
      # third-party action that runs its own sbt, so a hiccup there must not fail
      # the build — the real gate is the compile/test step above.
    - name: Upload dependency graph
      continue-on-error: true
      uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
