# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version-file: .sdkmanrc
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Check formatting and scalafix
      run: sbt "scalafmtSbtCheck; scalafmtCheckAll; scalafixAll --check; shutdown"

  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version-file: .sdkmanrc
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Compile and test with coverage
      run: sbt "coverage; compile; testFull; coverageReport; Test/verifyErrorCodes; shutdown"
    - name: Summarize coverage
      if: success() || failure()
      run: |
        xml=$(ls target/out/jvm/*/*/scoverage-report/scoverage.xml 2>/dev/null | head -1)
        if [ -z "$xml" ]; then echo "No coverage report produced" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
        stmt=$(grep -o 'statement-rate="[0-9.]*"' "$xml" | head -1 | cut -d'"' -f2)
        branch=$(grep -o 'branch-rate="[0-9.]*"' "$xml" | head -1 | cut -d'"' -f2)
        echo "Statement coverage: ${stmt}%, branch coverage: ${branch}%" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/out/jvm/*/*/scoverage-report/
        if-no-files-found: ignore
      # Optional: uploads the dependency graph for Dependabot alerts. It's a
      # third-party action that runs its own sbt, so a hiccup there must not fail
      # the build — the real gate is the compile/test step above.
    - name: Upload dependency graph
      if: github.event_name == 'push'
      continue-on-error: true
      uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
