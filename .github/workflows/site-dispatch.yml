# Template-internal CI helper — asks the website repo to rebuild after a docs change.
# `scripts/init-project.scala` deletes this workflow on init.
name: Site dispatch

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "README.md"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.SITE_DISPATCH_TOKEN }}
          repository: madrileno-dev/madrileno-dev.github.io
          event-type: docs-updated
